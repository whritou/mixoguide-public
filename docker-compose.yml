# Local development stack — mirrors production as closely as possible.
#
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: mixoguide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mixoguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-mixoguide}
    ports:
      # Expose to localhost so Prisma Studio and DB clients (TablePlus etc) work
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mixoguide}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mixoguide_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API — used by your Next.js app
      - "9001:9001"   # MinIO web UI — http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket bootstrap ───────────────────────────────────────────────────
  # Why: MinIO starts empty. This one-shot container creates the default bucket
  # automatically on first `docker compose up`, so you don't have to do it
  # manually through the UI every time you wipe volumes.
  minio-init:
    image: minio/mc:latest
    container_name: mixoguide_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/mixoguide-images;
        mc mb --ignore-existing local/mixoguide-storage;
        echo 'Buckets ready.';
      "

volumes:
  postgres_data:
  minio_data:
