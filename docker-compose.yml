# Local development stack. Ports are bound to 127.0.0.1 only.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://mixoguide:secret@localhost:5432/mixoguide
#   REDIS_HOST=localhost  REDIS_PORT=6379  REDIS_PASSWORD=devredis
#
# Postgres major version (18) matches CI (.github/workflows/*.yml).
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.1-alpine
    container_name: mixoguide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mixoguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-mixoguide}
      # postgres 18 images default PGDATA to /var/lib/postgresql/18/docker; pin it to the
      # existing volume path so local data created by earlier compose files keeps working.
      PGDATA: /var/lib/postgresql/data
    ports:
      # localhost only: Prisma Studio / DB clients work without exposing the DB on the LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mixoguide}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (shared rate limiting + makeable cache) ───────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: mixoguide_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devredis}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
