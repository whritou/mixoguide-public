name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  web-ci:
    name: Web - Lint, Type-check & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test coverage gates
        run: npm run test:coverage:check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  db-integration:
    name: DB Integration - Postgres + Vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mixoguide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mixoguide_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mixoguide_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mixoguide_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mixoguide_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:prod

      - name: Run DB integration tests
        run: npm run test:db

  mobile-ci:
    name: Mobile - Type-check, Lint & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type-check
        working-directory: mobile
        run: npm run type-check

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Test coverage gates
        working-directory: mobile
        run: npm run test:coverage:check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7
