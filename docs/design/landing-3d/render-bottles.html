/* ---------- studio environment ---------- */
function studioEnv() {
  const pm = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene(); env.background = new THREE.Color(0x070606);
  const box = (w, h, x, y, z, k, tint) => {

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));

  };
  box(0.9, 5.0, -3.0, 1.3, 2.6, 11);        // tall key softbox, front left
  box(0.35, 4.0, -1.2, 1.2, 3.6, 3.5);      // thin strip, front

  box(0.4, 3.5, 2.2, 1.0, -3.0, 4, true);   // back rim

/* ---------- label ---------- */
function labelTexture(o, tall) {
  return canvasTex(1024, tall ? 1280 : 600, (g, w, h) => {
    g.fillStyle = o.paper; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { g.fillStyle = 'rgba(90,70,40,' + (rnd() * 0.045) + ')'; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 1 + rnd() * 2); }
    g.strokeStyle = o.ink; g.lineWidth = 8; g.strokeRect(26, 26, w - 52, h - 52);
    g.lineWidth = 2.5; g.strokeRect(44, 44, w - 88, h - 88);
    g.fillStyle = o.band; g.fillRect(0, h - 128, w, 58);
    g.fillStyle = o.ink; g.textAlign = 'center';
    const cy = tall ? 470 : 250;

    let size = 128; g.font = '700 ' + size + 'px Georgia, serif';
    while (g.measureText(o.text).width > w - 190) { size -= 4; g.font = '700 ' + size + 'px Georgia, serif'; }

  }, true);
}
const paperBump = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); for (let i = 0; i < 5000; i++) { const v = 110 + rnd() * 40; g.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1); } });

/* ---------- caps ---------- */
function lathe(points, mat, seg) { return new THREE.Mesh(new THREE.LatheGeometry(points.map(p => new THREE.Vector2(p[0], p[1])), seg || 64), mat); }
function buildCap(o, top, lipR, neckR) {
  const g = new THREE.Group(); const col = o.capColor;

    const c = lathe([[0, 0.034], [r - 0.006, 0.034], [r, 0.028], [r, 0.004], [r - 0.004, 0], [0, 0]], m); c.position.y = top + 0.001; g.add(c);

    const ring = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.0015, r + 0.0015, 0.008, 64, 1, true), new THREE.MeshStandardMaterial({ color: col, roughness: 0.3, metalness: 1 })); ring.position.y = top - 0.048; g.add(ring);
  } else if (o.cap === 'capsule') {
    const m = new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.38, metalness: 0.75, clearcoat: 0.4 });
    const r = Math.max(lipR, neckR) + 0.004;
    const c = lathe([[0, 0.012], [r - 0.006, 0.012], [r, 0.006], [r, -0.03], [neckR + 0.004, -0.045], [neckR + 0.004, -0.19]], m); c.position.y = top; g.add(c);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(neckR + 0.0055, neckR + 0.0055, 0.012, 48, 1, true), new THREE.MeshStandardMaterial({ color: 0xd9b25a, roughness: 0.3, metalness: 1 })); band.position.y = top - 0.165; g.add(band);

    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.056, 48, 32), new THREE.MeshPhysicalMaterial({ map: wood, roughness: 0.45, clearcoat: 0.5, clearcoatRoughness: 0.3 })); ball.scale.y = 0.82; ball.position.y = top + 0.06; g.add(ball);

    const c = lathe([[0, h], [r - 0.008, h], [r, h - 0.008], [r, 0]], m, 96); c.position.y = top - 0.04; g.add(c);
  } else if (o.cap === 'crown') {
    const m = new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.85, bumpMap: knurl, bumpScale: 2.2 });
    const r = lipR + 0.002;
    const c = lathe([[0, 0.018], [r - 0.006, 0.018], [r, 0.012], [r + 0.006, -0.006]], m, 96); c.position.y = top - 0.004; g.add(c);

    const steel = new THREE.MeshStandardMaterial({ color: 0xe4e6e8, roughness: 0.18, metalness: 1 });

/* ---------- bottle ---------- */
function glassMat(c, dist, thickness, ior) {

function buildBottle(shape, o) {

  const up = new THREE.Mesh(new THREE.LatheGeometry(upper, 128), glassMat(o.glass[0], o.glass[1], 0.03, 1.5)); grp.add(up);
  const lowColor = new THREE.Color(o.liquid[0]).multiply(new THREE.Color(o.glass[0]).lerp(new THREE.Color(0xffffff), o.glass[1] > 1 ? 1 : 0.35));
  const lo = new THREE.Mesh(new THREE.LatheGeometry(lower, 128), glassMat(lowColor, Math.min(o.liquid[1], o.glass[1] < 1 ? o.glass[1] : 99), bodyR * 0.9, 1.33)); grp.add(lo);
  if (o.clear) {
    const men = new THREE.Mesh(new THREE.TorusGeometry(fr - 0.004, 0.0028, 12, 96), new THREE.MeshStandardMaterial({ color: 0xe8f0f0, roughness: 0.15, metalness: 0.2 }));
    men.rotation.x = Math.PI / 2; men.position.y = fy; grp.add(men);
  } else {
    const surf = new THREE.Mesh(new THREE.CircleGeometry(fr - 0.006, 64), new THREE.MeshPhysicalMaterial({ color: o.surf, roughness: 0.08, clearcoat: 1 }));
    surf.rotation.x = -Math.PI / 2; surf.position.y = fy - 0.002; grp.add(surf);
  }

    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n varying float vF;').replace('#include <opaque_fragment>', '#include <opaque_fragment>\n gl_FragColor.a = pow(vF, 3.5) * 0.5;');
  };
  const edge = new THREE.Mesh(new THREE.LatheGeometry(pts, 128), edgeMat); edge.renderOrder = 8; grp.add(edge);
  const [ly, lh] = shape.label; let maxR = 0; for (const p of pts) if (p.y >= ly - 0.01 && p.y <= ly + lh + 0.01 && p.x > maxR) maxR = p.x; const lr = maxR + (shape.loose ? 0.007 : 0.003); const arc = shape.loose ? Math.PI * 2 : 3.5;
  const label = new THREE.Mesh(new THREE.CylinderGeometry(lr, lr, lh, 128, 1, true, -arc / 2, arc), new THREE.MeshStandardMaterial({ map: labelTexture(o, shape.loose), bumpMap: paperBump, bumpScale: 0.25, roughness: 0.8, side: THREE.DoubleSide }));
  label.position.y = ly + lh / 2; label.rotation.y = -0.14; grp.add(label);

  grp.add(buildCap(o, top, lipR, neckR));
  return { grp: grp, r: bodyR, tint: o.clear ? null : o.liquid[0] };
}

/* ---------- fruit ---------- */
function skinMap(base, dark, light) {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 90; const gr = g.createRadialGradient(x, y, 0, x, y, r); const c = rnd() > 0.5 ? dark : light; gr.addColorStop(0, 'rgba(' + c + ',' + (0.05 + rnd() * 0.14) + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
    for (let i = 0; i < 9000; i++) { g.fillStyle = 'rgba(' + dark + ',' + (0.05 + rnd() * 0.12) + ')'; g.beginPath(); g.arc(rnd() * w, rnd() * h, 0.8 + rnd() * 1.4, 0, 7); g.fill(); }

const poreBump = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#909090'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) { const x = rnd() * w, y = rnd() * h, r = 14 + rnd() * 40; const gr = g.createRadialGradient(x, y, 0, x, y, r); const v = rnd() > 0.5 ? 255 : 0; gr.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',0.10)'); gr.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  for (let i = 0; i < 16000; i++) { const x = rnd() * w, y = rnd() * h, r = 1.2 + rnd() * 2.4; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(20,20,20,0.75)'); gr.addColorStop(1, 'rgba(20,20,20,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }

function cutFace(rind, pith, pulpA, pulpB, segs) {

    g.fillStyle = pith; g.beginPath(); g.arc(c, c, c - 22, 0, 7); g.fill();

function buildFruit(kind) {
  const grp = new THREE.Group(); const lemon = kind === 'lemon';
  const R = lemon ? 0.098 : 0.104;
  const map = lemon ? skinMap('#f0c81a', '150,110,0', '255,236,120') : skinMap('#4c8a1a', '24,60,8', '150,190,60');
  const skin = new THREE.MeshPhysicalMaterial({ map: map, bumpMap: poreBump, bumpScale: 1.6, roughness: 0.46, clearcoat: 0.35, clearcoatRoughness: 0.38, sheen: 0.4, sheenColor: new THREE.Color(lemon ? 0xfff0a0 : 0xc8e890), envMapIntensity: 0.85 });
  const geo = new THREE.SphereGeometry(R, 128, 96); const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n = 1 + 0.006 * Math.sin(x * 34 + y * 21) + 0.005 * Math.sin(z * 29 - y * 26) + 0.004 * Math.sin(x * 17 + z * 23);
    x *= n; y *= n; z *= n;
    if (lemon) { const t = x / R; const k = 1 - Math.pow(Math.abs(t), 3.2) * 0.22; y *= k; z *= k; x = x * 1.26 + Math.sign(t) * Math.pow(Math.abs(t), 9) * 0.026; }
    else { y *= 0.93; }
    pos.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
  const whole = new THREE.Mesh(geo, skin); whole.position.set(-0.075, lemon ? R * 0.94 : R * 0.93, -0.05); whole.rotation.set(0.15, lemon ? 0.45 : 0.3, lemon ? 0.06 : 0); grp.add(whole);
  if (!lemon) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.011, 0.008, 10), new THREE.MeshStandardMaterial({ color: 0x4a3a1c, roughness: 0.95 })); s.position.set(-0.075 + 0.006, R * 1.855, -0.05 + 0.012); grp.add(s); }
  const Rh = R * 0.95;
  const half = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(Rh, 96, 48, 0, Math.PI * 2, 0, Math.PI / 2), skin); half.add(dome);
  const face = new THREE.Mesh(new THREE.CircleGeometry(Rh, 96), new THREE.MeshPhysicalMaterial({
    map: lemon ? cutFace('#e9c019', '#fbf3cf', '#f3de6a', '#f8eda6', 10) : cutFace('#5a941f', '#eef2c8', '#b9d35a', '#dbe99a', 10),
    roughness: 0.22, clearcoat: 0.9, clearcoatRoughness: 0.18, envMapIntensity: 0.9 }));
  face.rotation.x = Math.PI / 2; face.position.y = -0.0005; half.add(face);
  half.rotation.set(-1.80, 0, 0); half.rotation.order = 'YXZ'; half.rotation.y = -0.38;
  half.position.set(0.105, Rh * 0.985, 0.09); grp.add(half);
  grp.scale.setScalar(1.28);
  return { grp: grp, r: 0.2, tint: null, fruit: true };
}

/* ---------- ground: contact shadow + colour cast ---------- */
function ground(scene, info) {
  const sh = canvasTex(256, 256, (g) => { const gr = g.createRadialGradient(128, 128, 6, 128, 128, 128); gr.addColorStop(0, 'rgba(0,0,0,0.72)'); gr.addColorStop(0.4, 'rgba(0,0,0,0.34)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); });
  const mk = (w, d, x, z, tex, y) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.renderOrder = -2; scene.add(m); };
  if (info.fruit) { mk(0.44, 0.33, -0.08, -0.05, sh, 0.001); mk(0.38, 0.26, 0.15, 0.115, sh, 0.0012); return; }
  mk(info.r * 3.8, info.r * 2.6, info.r * 0.28, 0, sh, 0.001);
  if (info.tint) {
    const c = new THREE.Color(info.tint); const rgb = Math.round(c.r * 255) + ',' + Math.round(c.g * 255) + ',' + Math.round(c.b * 255);
    const ct = canvasTex(256, 256, (g) => { const gr = g.createRadialGradient(128, 128, 4, 128, 128, 128); gr.addColorStop(0, 'rgba(' + rgb + ',0.55)'); gr.addColorStop(0.5, 'rgba(' + rgb + ',0.2)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }, true);
    mk(info.r * 2.6, info.r * 1.5, info.r * 1.05, 0.05, ct, 0.0015);

}

/* ---------- difference matte ---------- */
const lin = new Float32Array(256); for (let i = 0; i < 256; i++) { const v = i / 255; lin[i] = v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
const toS = (v) => { v = Math.min(Math.max(v, 0), 1); return Math.round((v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055) * 255); };
const big = document.createElement('canvas'); big.width = RW; big.height = RH; const bctx = big.getContext('2d', { willReadFrequently: true });
function grab(scene, bg) { scene.background = new THREE.Color(bg); renderer.render(scene, cam); bctx.drawImage(renderer.domElement, 0, 0); return bctx.getImageData(0, 0, RW, RH); }
function matte(scene) {
  const W = grab(scene, 0xffffff).data, B = grab(scene, 0x000000).data;
  const wl = [lin[W[0]], lin[W[1]], lin[W[2]]];
  const out = bctx.createImageData(RW, RH); const O = out.data;
  for (let i = 0; i < W.length; i += 4) {
    let t = 1; const lb = [0, 0, 0], lw = [0, 0, 0];
    for (let c = 0; c < 3; c++) { lw[c] = lin[W[i + c]]; lb[c] = lin[B[i + c]]; const d = Math.min(Math.max((lw[c] - lb[c]) / wl[c], 0), 1); if (d < t) t = d; }
    const a = 1 - t;
    if (a < 0.006) { O[i + 3] = 0; continue; }
    for (let c = 0; c < 3; c++) { const p = 0.5 * (lb[c] + Math.max(lw[c] - t * wl[c], 0)); O[i + c] = toS(p / a); }
    O[i + 3] = Math.round(a * 255);
  }
  bctx.putImageData(out, 0, 0);
  const small = document.createElement('canvas'); small.width = OW; small.height = OH; small.className = 'o';
  const sctx = small.getContext('2d'); sctx.imageSmoothingQuality = 'high'; sctx.drawImage(big, 0, 0, OW, OH);
  document.body.appendChild(small); return small;
}
async function save(canvas, name) { const blob = await new Promise(r => canvas.toBlob(r, 'image/png')); await fetch('/out/' + name, { method: 'PUT', body: blob }); }

(async () => {
  for (const [id, shapeName, o] of ITEMS) {
    if (only && !only.split(',').includes(id)) continue;
    const scene = newScene();
    const info = SHAPES[shapeName] ? buildBottle(SHAPES[shapeName], o) : buildFruit(shapeName);
    scene.add(info.grp); ground(scene, info);
    await save(matte(scene), id + '.png');
    meta.items.push(id);
    await new Promise(r => setTimeout(r, 30));
  }
  meta.done = true;
})().catch(e => { meta.error = String(e && e.stack || e); });
